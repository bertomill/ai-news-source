<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#64748b"/>
  
  <!-- AI News Tap Icon - News paper with AI symbol -->
  <rect x="128" y="160" width="256" height="320" rx="16" fill="#f8fafc"/>
  
  <!-- News paper lines -->
  <rect x="160" y="200" width="192" height="4" rx="2" fill="#64748b"/>
  <rect x="160" y="220" width="160" height="4" rx="2" fill="#64748b"/>
  <rect x="160" y="240" width="180" height="4" rx="2" fill="#64748b"/>
  <rect x="160" y="260" width="140" height="4" rx="2" fill="#64748b"/>
  
  <!-- AI symbol in center -->
  <circle cx="256" cy="320" r="32" fill="#64748b"/>
  <text x="256" y="330" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="bold">AI</text>
  
  <!-- News paper fold -->
  <path d="M128 160 L160 192 L128 192 Z" fill="#e2e8f0"/>
</svg>
